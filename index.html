    /* ===== Page Header ===== */
    .page-header{text-align:center;margin-bottom:1.5rem;}
    .page-header .site-tagline{font-size:1.6rem;font-weight:800;color:#ff6b35;text-transform:uppercase;letter-spacing:1px;margin:0;}
    /* ===== Featured Insights ===== */
    .featured-section{max-width:1100px;margin:0 auto 2rem;padding:0 1rem;text-align:left;}
    .featured-section h2{font-size:1.3rem;font-weight:700;color:#1a1a1a;margin-bottom:1rem;}
    .featured-card{display:block;padding:0.9rem 1.15rem;border:1px solid #e5e7eb;border-radius:10px;margin-bottom:0.65rem;text-decoration:none;color:inherit;transition:box-shadow .2s,border-color .2s;}
    .featured-card:hover{border-color:#ff6b35;box-shadow:0 2px 10px rgba(255,107,53,.08);}
    .featured-card-title{font-size:1.02rem;font-weight:600;color:#1a1a1a;margin:0 0 .2rem;line-height:1.35;}
    .featured-card-meta{font-size:.8rem;color:#888;margin-bottom:.3rem;}
    .featured-card-meta .cat{color:#ff6b35;font-weight:600;}
    .featured-card-excerpt{font-size:.86rem;color:#555;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:0;}
    .featured-read-more{display:inline-block;margin-top:.5rem;padding:5px 16px;background:#ff6b35;color:#fff;border:none;border-radius:8px;font-size:.8rem;font-weight:600;cursor:pointer;transition:background .2s;}
    .featured-read-more:hover{background:#e55a2b;}
    /* ===== Hero Intro — Left Aligned ===== */
    .hero-intro{max-width:1100px;margin:0 auto 2rem;padding:0 1rem;text-align:left;color:#444;line-height:1.75;font-size:0.95rem;}
    .hero-intro p{margin-bottom:0.9rem;}
    .hero-intro p:last-child{margin-bottom:0;}
    /* ===== Latest Insights Section (Bottom) ===== */
    .latest-section{max-width:1100px;margin:0 auto 3rem;padding:0 1rem;}
    .latest-section h2{font-size:1.4rem;font-weight:700;color:#1a1a1a;margin-bottom:1.1rem;}
    .latest-card{display:block;padding:0.9rem 1.2rem;border:1px solid #e5e7eb;border-radius:10px;margin-bottom:0.7rem;text-decoration:none;color:inherit;transition:box-shadow .2s,border-color .2s;}
    .latest-card:hover{border-color:#ff6b35;box-shadow:0 2px 12px rgba(255,107,53,.10);}
    .latest-card-title{font-size:1.08rem;font-weight:700;color:#1a1a1a;margin:0 0 .25rem;line-height:1.35;}
    .latest-card-meta{font-size:.82rem;color:#888;margin-bottom:.35rem;}
    .latest-card-meta .cat{color:#ff6b35;font-weight:600;}
    .latest-card-excerpt{font-size:.88rem;color:#555;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:0;}
    .read-more-btn-inline{display:inline-block;margin-top:.7rem;padding:5px 16px;background:#ff6b35;color:#fff;border:none;border-radius:8px;font-size:.8rem;font-weight:600;cursor:pointer;transition:background .2s;}
    .read-more-btn-inline:hover{background:#e55a2b;}
    /* ===== Mobile Header Optimization ===== */
    @media(max-width:768px){
        .header-content{padding:0 16px!important;min-height:0!important;}
        .header{padding:0!important;}
        .logo svg{max-height:36px!important;width:auto!important;}
        .nav{font-size:14px!important;}
        .nav a{font-size:14px!important;padding:6px 8px!important;}
        .search-box input{font-size:13px!important;height:32px!important;}
        .search-box button{font-size:14px!important;height:32px!important;width:32px!important;}
        .page-header{margin-top:0.5rem!important;margin-bottom:0.7rem!important;}
        .page-header .site-tagline{font-size:1.25rem!important;}
        .hero-intro{margin-bottom:1rem!important;}
        .hero-intro p{font-size:0.85rem!important;line-height:1.5!important;margin-bottom:0.5rem!important;}
        .featured-section{margin-bottom:1.2rem!important;}
        .featured-section h2{font-size:1.15rem!important;}
        .featured-card{padding:0.7rem 0.85rem!important;margin-bottom:0.5rem!important;}
        .featured-card-title{font-size:0.92rem!important;}
        .featured-card-meta{font-size:0.75rem!important;margin-bottom:0.2rem!important;}
        .featured-card-excerpt{font-size:0.8rem!important;line-height:1.4!important;}
        .latest-section{margin-bottom:1.5rem!important;}
        .latest-card{padding:0.7rem 0.85rem!important;margin-bottom:0.55rem!important;}
        .latest-card-title{font-size:0.95rem!important;}
        .latest-card-meta{font-size:0.76rem!important;margin-bottom:0.25rem!important;}
        .latest-card-excerpt{font-size:0.82rem!important;line-height:1.4!important;}
    }
    /* ===== Ad Slots ===== */
    .ad-slot{margin:1.2rem auto;text-align:center;min-height:0;overflow:hidden;transition:all 0.3s ease;}
    .ad-slot.has-ad{min-height:250px;}
    .ad-slot.ad-hidden{display:none!important;}
    @media(max-width:768px){.ad-slot.has-ad{min-height:200px;}}

    <script>
    // ===== SUBDOMAIN CONFIG =====
    var SITE_CONFIGS = {
        'finance': {
            name: 'Finance',
            tagline: 'FINANCE NEWS & INSIGHTS',
            aboutText: 'Your trusted source for the latest insights in Technology, Finance, AI Tools, and Health & Lifestyle.',
            fallbackImage: 'https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?w=600&h=400&fit=crop',
            jsonFile: 'articles-finance.json',
            titleSuffix: 'Finance News, Investing & Market Insights | HelloInsights',
            metaDesc: 'Explore personal finance, investing, markets, banking, fintech, economic trends and money management insights from HelloInsights Finance.',
            heroIntro: '<p>Finance influences how we save, invest, spend, and plan for the future. HelloInsights Finance explores <strong>Personal Finance, Investing, Markets, Banking, Fintech, Economy, and Money Management</strong>, connecting practical financial knowledge with broader trends shaping money and markets.</p><p>Our editorial coverage goes beyond headlines to explain why financial developments matter — from investment strategies and banking innovation to inflation, interest rates, and economic shifts.</p>',
            gaId: 'G-FINANCE-XXXXXXX'
        },
        'technology': {
            name: 'Technology',
            tagline: 'TECHNOLOGY NEWS & INSIGHTS',
            aboutText: 'Your trusted source for the latest insights in Technology, Finance, AI Tools, and Health & Lifestyle.',
            fallbackImage: 'https://images.unsplash.com/photo-1518770660439-4636190af475?w=600&h=400&fit=crop',
            jsonFile: 'articles-technology.json',
            titleSuffix: 'Technology News & Innovation Insights | HelloInsights',
            metaDesc: 'Explore the latest technology news, product reviews, digital innovation and industry insights from HelloInsights Technology.',
            heroIntro: '',
            gaId: 'G-TECH-XXXXXXX'
        },
        'ai-tools': {
            name: 'AI Tools',
            tagline: 'AI TOOLS NEWS & INSIGHTS',
            aboutText: 'Your trusted source for the latest insights in Technology, Finance, AI Tools, and Health & Lifestyle.',
            fallbackImage: 'https://images.unsplash.com/photo-1677442136019-21780ecf995?w=600&h=400&fit=crop',
            jsonFile: 'articles-ai-tools.json',
            titleSuffix: 'AI Tools News & Reviews | HelloInsights',
            metaDesc: 'Explore the latest AI tools news, reviews, and artificial intelligence insights from HelloInsights AI Tools.',
            heroIntro: '',
            gaId: 'G-AITOOLS-XXXXXXX'
        },
        'health-lifestyle': {
            name: 'Health & Lifestyle',
            tagline: 'HEALTH & LIFESTYLE INSIGHTS',
            aboutText: 'Your trusted source for the latest insights in Technology, Finance, AI Tools, and Health & Lifestyle.',
            fallbackImage: 'https://images.unsplash.com/photo-1498837167922-ddd27525d352?w=600&h=400&fit=crop',
            jsonFile: 'articles-health-lifestyle.json',
            titleSuffix: 'Health & Lifestyle Insights | HelloInsights',
            metaDesc: 'Explore the latest health news, wellness tips, and lifestyle insights from HelloInsights Health & Lifestyle.',
            heroIntro: '',
            gaId: 'G-HEALTH-XXXXXXX'
        }
    };
    // ===== GA4 — Independent per subdomain =====
    (function() {
        var host = window.location.hostname;
        var sub = host.split('.')[0];
        var cfg = SITE_CONFIGS[sub];
        var isSubdomain = !!cfg;
        var gaId = isSubdomain ? cfg.gaId : 'G-Q4QHZKZT46';
        if (!gaId || gaId.indexOf('XXXXXXX') !== -1) return;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + gaId;
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        window.gtag = gtag;
        gtag('js', new Date());
        gtag('config', gaId);
    })();
    // ===== Auto-detect subdomain =====
    var host = window.location.hostname;
    var sub = host.split('.')[0];
    var CFG = SITE_CONFIGS[sub] || SITE_CONFIGS['finance'];
    var CAT_ID = sub;
    // window.IS_SUBDOMAIN already set in <head> before config-loader.js loads
    // ===== APPLY CONFIG TO PAGE =====
    document.title = CFG.titleSuffix;
    document.querySelector('meta[name="description"]').setAttribute('content', CFG.metaDesc);
    document.getElementById('siteTagline').textContent = CFG.tagline;
    document.getElementById('footerAboutTitle').textContent = 'About HelloInsights';
    document.getElementById('footerAboutText').textContent = CFG.aboutText;
    // Hero Intro
    var heroIntroEl = document.getElementById('heroIntro');
    if (heroIntroEl && CFG.heroIntro) {
        heroIntroEl.innerHTML = CFG.heroIntro;
    } else if (heroIntroEl) {
        heroIntroEl.style.display = 'none';
    }
    // Nav
    document.getElementById('navList').innerHTML =
        '<li><a href="index.html">Home</a></li>' +
        '<li><a href="index.html" class="active">' + CFG.name + '</a></li>';
    // Footer links
    document.getElementById('footerLinks').innerHTML =
        '<li><a href="index.html">Home</a></li>' +
        '<li><a href="index.html">' + CFG.name + '</a></li>';
    // ===== ARTICLE LOGIC =====
    var ARTICLES_PER_PAGE = 9;
    var currentPage = 1;
    var filteredArticles = [];
    var isSearching = false;
    var searchQuery = '';
    var categoryNames = {};
    categoryNames[CAT_ID] = CFG.name;
    var fallbackImages = {};
    fallbackImages[CAT_ID] = CFG.fallbackImage;
    var defaultFallback = CFG.fallbackImage;
    var allArticlesCache = [];
    var latestExpanded = false;
    var featuredExpanded = false;
    var allFeaturedArticles = [];
    function formatDate(dateStr) {
        if (!dateStr) return '';
        var parts = dateStr.split('-');
        if (parts.length !== 3) return dateStr;
        var d = new Date(parts[0] + '-' + parts[1] + '-' + parts[2]);
        var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
        return months[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
    }
    function getFallbackImage(cat) { return fallbackImages[cat] || defaultFallback; }
    function createArticleCard(article) {
        if (!article || !article.id) return '';
        var catName = categoryNames[article.category] || article.category || '';
        var fb = getFallbackImage(article.category);
        var dateDisplay = formatDate(article.date);
        var title = article.title || 'Untitled';
        var image = article.image || fb;
        var excerpt = article.excerpt || '';
        return '<article class="article-card">' +
            '<div class="card-image"><img src="' + image + '" alt="' + title + '" width="600" height="400" loading="lazy" decoding="async" onerror="this.src=\'' + fb + '\'"></div>' +
            '<div class="card-content">' +
            '<span class="card-category">' + catName + '</span>' +
            '<h3 class="card-title"><a href="article.html?id=' + article.id + '">' + title + '</a></h3>' +
            '<p class="card-excerpt">' + excerpt + '</p>' +
            '<div class="card-meta"><span>' + dateDisplay + '</span></div>' +
            '<a href="article.html?id=' + article.id + '" class="read-more-btn">Read More</a>' +
            '</div></article>';
    }
    function renderPagination(total) {
        var pages = Math.ceil(total / ARTICLES_PER_PAGE);
        var el = document.getElementById('pagination');
        if (!el || pages <= 1) { if (el) el.innerHTML = ''; return; }
        var h = '';
        if (currentPage > 1) h += '<a href="#" class="page-btn" onclick="changePage(' + (currentPage - 1) + ');return false;">‹</a>';
        else h += '<span class="page-btn disabled">‹</span>';
        var range = 2;
        var start = Math.max(2, currentPage - range);
        var end = Math.min(pages - 1, currentPage + range);
        if (currentPage === 1) h += '<span class="page-btn active">1</span>';
        else h += '<a href="#" class="page-btn" onclick="changePage(1);return false;">1</a>';
        if (start > 2) h += '<span class="page-btn disabled" style="cursor:default;">…</span>';
        for (var i = start; i <= end; i++) {
            if (i === currentPage) h += '<span class="page-btn active">' + i + '</span>';
            else h += '<a href="#" class="page-btn" onclick="changePage(' + i + ');return false;">' + i + '</a>';
        }
        if (end < pages - 1) h += '<span class="page-btn disabled" style="cursor:default;">…</span>';
        if (currentPage === pages) h += '<span class="page-btn active">' + pages + '</span>';
        else h += '<a href="#" class="page-btn" onclick="changePage(' + pages + ');return false;">' + pages + '</a>';
        if (currentPage < pages) h += '<a href="#" class="page-btn" onclick="changePage(' + (currentPage + 1) + ');return false;">›</a>';
        else h += '<span class="page-btn disabled">›</span>';
        el.innerHTML = h;
    }
    function changePage(p) {
        if (isSearching) {
            var t = Math.ceil(filteredArticles.length / ARTICLES_PER_PAGE);
            if (p < 1 || p > t) return;
            currentPage = p;
            renderSearchResults(filteredArticles);
        } else {
            var t2 = Math.ceil(allArticlesCache.length / ARTICLES_PER_PAGE);
            if (p < 1 || p > t2) return;
            currentPage = p;
            fetchArticlesForPage(p);
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    function handleSearch() {
        var input = document.getElementById('searchInput');
        if (!input) return;
        var q = input.value.trim();
        searchQuery = q;
        if (!q) { clearSearch(); return; }
        isSearching = true; currentPage = 1;
        var lq = q.toLowerCase();
        filteredArticles = allArticlesCache.filter(function(a) {
            var cn = categoryNames[a.category] || a.category;
            return a.title.toLowerCase().indexOf(lq) !== -1 || a.excerpt.toLowerCase().indexOf(lq) !== -1 ||
                   a.category.toLowerCase().indexOf(lq) !== -1 || cn.toLowerCase().indexOf(lq) !== -1;
        });
        var si = document.getElementById('searchInfo'), st = document.getElementById('searchText');
        if (si && st) { si.style.display = 'block'; st.textContent = 'Found ' + filteredArticles.length + ' results for "' + q + '"'; }
        renderSearchResults(filteredArticles);
    }
    function clearSearch() {
        isSearching = false; searchQuery = ''; currentPage = 1;
        var input = document.getElementById('searchInput');
        if (input) input.value = '';
        var si = document.getElementById('searchInfo');
        if (si) si.style.display = 'none';
        fetchArticlesForPage(1);
    }
    function initSearch() {
        var input = document.getElementById('searchInput'), btn = document.getElementById('searchBtn');
        if (input) input.addEventListener('keypress', function(e) { if (e.key === 'Enter') { e.preventDefault(); handleSearch(); } });
        if (btn) btn.addEventListener('click', function(e) { e.preventDefault(); handleSearch(); });
    }
    function fetchArticlesForPage(page) {
        var start = (page - 1) * ARTICLES_PER_PAGE;
        renderPageArticles(allArticlesCache.slice(start, start + ARTICLES_PER_PAGE));
    }
    function renderPageArticles(articles) {
        var grid = document.getElementById('articleGrid');
        var loading = document.getElementById('loading');
        if (loading) loading.remove();
        if (!grid) return;
        var valid = articles.filter(function(a) { return a && a.id; });
        if (valid.length === 0) {
            grid.innerHTML = '<p style="text-align:center;grid-column:1/-1;padding:3rem;">No articles found.</p>';
            document.getElementById('pagination').innerHTML = '';
            return;
        }
        var html = '';
        for (var i = 0; i < valid.length; i++) {
            try { html += createArticleCard(valid[i]); } catch(e) { console.warn('Card render error:', e); }
        }
        if (!html) { grid.innerHTML = '<p style="text-align:center;grid-column:1/-1;padding:3rem;">No articles found.</p>'; document.getElementById('pagination').innerHTML = ''; return; }
        grid.innerHTML = html;
        renderPagination(allArticlesCache.length);
        if (window.AdConfig && typeof window.AdConfig.renderAll === 'function') {
            window.AdConfig.renderAll();
        }
    }
    function renderSearchResults(articles) {
        var grid = document.getElementById('articleGrid');
        var loading = document.getElementById('loading');
        if (loading) loading.remove();
        if (!grid) return;
        var validAll = articles.filter(function(a) { return a && a.id; });
        if (validAll.length === 0) {
            grid.innerHTML = '<p style="text-align:center;grid-column:1/-1;padding:3rem;color:#666;">No articles found for "' + searchQuery + '".</p>';
            document.getElementById('pagination').innerHTML = '';
            return;
        }
        var start = (currentPage - 1) * ARTICLES_PER_PAGE;
        var page = validAll.slice(start, start + ARTICLES_PER_PAGE);
        var html = '';
        for (var i = 0; i < page.length; i++) {
            html += createArticleCard(page[i]);
        }
        grid.innerHTML = html;
        renderPagination(validAll.length);
        if (window.AdConfig && typeof window.AdConfig.renderAll === 'function') {
            window.AdConfig.renderAll();
        }
    }
    function renderFeaturedInsights(articles) {
        allFeaturedArticles = articles;
        var container = document.getElementById('featuredCards');
        var section = document.getElementById('featuredSection');
        var readMoreWrap = document.getElementById('featuredReadMoreWrap');
        if (!container || !section || articles.length === 0) { if (section) section.style.display = 'none'; return; }
        var showCount = featuredExpanded ? Math.min(12, articles.length) : Math.min(3, articles.length);
        var html = '';
        for (var i = 0; i < showCount; i++) {
            var a = articles[i];
            if (!a || !a.id) continue;
            var catName = categoryNames[a.category] || a.category || '';
            html += '<a class="featured-card" href="article.html?id=' + a.id + '">' +
                '<p class="featured-card-title">' + (a.title || '') + '</p>' +
                '<p class="featured-card-meta"><span class="cat">' + catName + '</span> · ' + formatDate(a.date) + '</p>' +
                '<p class="featured-card-excerpt">' + (a.excerpt || '') + '</p>' +
                '</a>';
        }
        container.innerHTML = html;
        if (readMoreWrap) {
            if (!featuredExpanded && articles.length > 3) {
                readMoreWrap.style.display = 'block';
            } else {
                readMoreWrap.style.display = 'none';
            }
        }
    }
    function expandFeatured() {
        featuredExpanded = true;
        renderFeaturedInsights(allFeaturedArticles);
    }
    var allLatestArticles = [];
    function renderLatestInsights(articles) {
        allLatestArticles = articles;
        var container = document.getElementById('latestCards');
        var section = document.getElementById('latestSection');
        var readMoreWrap = document.getElementById('latestReadMoreWrap');
        if (!container || !section || articles.length === 0) { if (section) section.style.display = 'none'; return; }
        var showCount = latestExpanded ? articles.length : Math.min(3, articles.length);
        var html = '';
        for (var i = 0; i < showCount; i++) {
            var a = articles[i];
            if (!a || !a.id) continue;
            var catName = categoryNames[a.category] || a.category || '';
            html += '<a class="latest-card" href="article.html?id=' + a.id + '">' +
                '<p class="latest-card-title">' + (a.title || '') + '</p>' +
                '<p class="latest-card-meta"><span class="cat">' + catName + '</span> · ' + formatDate(a.date) + '</p>' +
                '<p class="latest-card-excerpt">' + (a.excerpt || '') + '</p>' +
                '</a>';
        }
        container.innerHTML = html;
        if (readMoreWrap) {
            if (!latestExpanded && articles.length > 3) {
                readMoreWrap.style.display = 'block';
            } else {
                readMoreWrap.style.display = 'none';
            }
        }
    }
    function expandLatestInsights() {
        latestExpanded = true;
        renderLatestInsights(allLatestArticles);
    }
    fetch(CFG.jsonFile + '?v=' + Date.now())
        .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(function(data) {
            allArticlesCache = (data.articles || []).filter(function(a) { return a && a.id; });
            allArticlesCache.sort(function(a, b) {
                var c = (b.date || '').localeCompare(a.date || '');
                return c !== 0 ? c : (Math.random() - 0.5);
            });
            renderFeaturedInsights(allArticlesCache.slice(0, 12));
            renderLatestInsights(allArticlesCache.slice(0, 10));
            fetchArticlesForPage(1);
            initSearch();
        })
        .catch(function(err) {
            console.error('Load error:', err.message);
            var grid = document.getElementById('articleGrid');
            if (grid) grid.innerHTML = '<p style="text-align:center;grid-column:1/-1;padding:3rem;color:#999;">Unable to load articles: ' + err.message + '</p>';
        });
    if (typeof loadSiteConfig === 'function') {
        loadSiteConfig(function(config) {
            if (config && config.categories) {
                for (var i = 0; i < config.categories.length; i++) {
                    if (config.categories[i].id === CAT_ID) {
                        categoryNames[CAT_ID] = config.categories[i].name;
                    }
                }
            }
        });
    }
    </script>
</body>
</html>
