name: Auto Generate Articles

on:
  schedule:
    # 每周一 UTC 0:00 运行（北京时间/韩国时间周一 8:00）
    - cron: '0 0 * * 1'
  workflow_dispatch: # 手动触发

permissions:
  contents: write

jobs:
  generate-articles:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate new articles
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node generate-articles.js

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add articles-index.json articles-*.json
          git diff --staged --quiet || git commit -m "Auto-generate articles [skip ci]"
          git push
