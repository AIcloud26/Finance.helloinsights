<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Favicon -->
<link rel="icon" type="image/png" href="favicon-16x16.png">
<link rel="icon" type="image/x-icon" href="favicon-16.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Read the latest insights and articles on HelloInsights.">
    <title>Article - HelloInsights</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://images.unsplash.com">
    <link rel="dns-prefetch" href="https://images.unsplash.com">
    <!-- ============ Subdomain Config (must run early) ============ -->
    <script>
    (function() {
        var hostname = window.location.hostname;
        var subdomain = '';
        var parts = hostname.split('.');
        if (parts.length > 3 && parts[0] !== 'www') {
            subdomain = parts[0];
        }
        var subCategoryMap = {
            'technology': 'technology',
            'finance': 'finance',
            'ai-tools': 'ai-tools',
            'health-lifestyle': 'health-lifestyle'
        };
        window.SUBDOMAIN_CATEGORY = subCategoryMap[subdomain] || null;
        window.IS_SUBDOMAIN = !!window.SUBDOMAIN_CATEGORY;

        // Dynamic preload for subdomain
        if (window.IS_SUBDOMAIN) {
            var link = document.createElement('link');
            link.rel = 'preload';
            link.href = 'articles-' + window.SUBDOMAIN_CATEGORY + '.json';
            link.as = 'fetch';
            link.crossOrigin = 'anonymous';
            document.head.appendChild(link);
        }
    })();
    </script>
    <link rel="stylesheet" href="style.css">
    <script src="config-loader.js"></script>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <a href="index.html" class="logo">
                <img loading="lazy" decoding="async" src="logo.webp" alt="HelloInsights" class="logo-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';">
                <span class="logo-text" style="display:none;">HelloInsights</span>
            </a>
            <div class="menu-toggle" onclick="toggleMenu()">
                <span></span><span></span><span></span>
            </div>
            <div class="nav-container" id="navContainer">
                <nav>
                    <ul class="nav" id="navList">
                        <!-- Dynamic nav rendered by JavaScript based on subdomain -->
                    </ul>
                </nav>
                <div class="search-box">
                    <input type="text" placeholder="Search articles..." id="searchInput">
                    <button type="button" id="searchBtn">🔍</button>
                </div>
            </div>
        </div>
    </header>
    <main class="container">
        <!-- AdSense: article-banner -->
        <div data-ad-slot="article-banner"></div>
        <article class="article-detail" id="articleDetail">
            <div class="loading" id="loading"></div>
        </article>
        <!-- MGID: article-mgid -->
        <div data-ad-slot="article-mgid"></div>
        <!-- AdSense: article-interstitial -->
        <div data-ad-slot="article-interstitial"></div>
        <section class="mb-4" style="margin-top: 3rem;" id="relatedSection">
            <h2 class="mb-2">Related Articles</h2>
            <div class="article-grid" id="relatedGrid"></div>
        </section>
    </main>
    <footer class="footer">
        <div class="footer-content">
            <div class="footer-section">
                <h4>About HelloInsights</h4>
                <p id="footerAbout">Your trusted source for the latest insights in Technology, Finance, AI Tools, and Health & Lifestyle.</p>
            </div>
            <div class="footer-section">
                <h4>Quick Links</h4>
                <ul id="footerNav">
                    <!-- Dynamic footer nav rendered by JavaScript based on subdomain -->
                </ul>
            </div>
            <div class="footer-section">
                <h4>Legal</h4>
                <ul>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="contact.html">Contact Us</a></li>
                    <li><a href="privacy.html">Privacy Policy</a></li>
                    <li><a href="terms.html">Terms of Service</a></li>
                </ul>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; <script>document.write(new Date().getFullYear())</script> HelloInsights. All rights reserved.</p>
        </div>
    </footer>
    <button class="back-to-top" id="backToTop" onclick="scrollToTop()">↑</button>
    <script>
    // ==========================================
    // Subdomain-based Navigation & Content
    // ==========================================
    var categoryNames = {
        'technology': 'Technology', 'finance': 'Finance',
        'ai-tools': 'AI Tools', 'health-lifestyle': 'Health & Lifestyle'
    };
    var categoryDescs = {
        'technology': 'Latest innovations in software, hardware, cloud, and emerging tech.',
        'finance': 'Market trends, investment insights, and financial intelligence.',
        'ai-tools': 'AI-powered tools, productivity apps, and automation solutions.',
        'health-lifestyle': 'Wellness tips, health research, and lifestyle optimization.'
    };

    // Render navigation based on subdomain
    function renderNavigation() {
        var navList = document.getElementById('navList');
        if (!navList) return;
        var html = '';
        if (window.IS_SUBDOMAIN) {
            // Subdomain: only show this category
            var cat = window.SUBDOMAIN_CATEGORY;
            html += '<li><a href="index.html" class="active">' + categoryNames[cat] + '</a></li>';
        } else {
            // Main domain: show all categories
            html += '<li><a href="index.html">All</a></li>';
            html += '<li><a href="category.html?cat=technology">Technology</a></li>';
            html += '<li><a href="category.html?cat=finance">Finance</a></li>';
            html += '<li><a href="category.html?cat=ai-tools">AI Tools</a></li>';
            html += '<li><a href="category.html?cat=health-lifestyle">Health & Lifestyle</a></li>';
        }
        navList.innerHTML = html;
    }

    // Render footer navigation based on subdomain
    function renderFooterNav() {
        var footerNav = document.getElementById('footerNav');
        var footerAbout = document.getElementById('footerAbout');
        if (window.IS_SUBDOMAIN) {
            var cat = window.SUBDOMAIN_CATEGORY;
            if (footerNav) {
                footerNav.innerHTML = '<li><a href="index.html">Home</a></li>' +
                    '<li><a href="category.html?cat=' + cat + '">' + categoryNames[cat] + '</a></li>';
            }
            if (footerAbout) {
                footerAbout.textContent = 'Your trusted source for the latest ' + categoryNames[cat] + ' news and insights.';
            }
        } else {
            if (footerNav) {
                footerNav.innerHTML = '<li><a href="index.html">Home</a></li>' +
                    '<li><a href="category.html?cat=technology">Technology</a></li>' +
                    '<li><a href="category.html?cat=finance">Finance</a></li>' +
                    '<li><a href="category.html?cat=ai-tools">AI Tools</a></li>' +
                    '<li><a href="category.html?cat=health-lifestyle">Health & Lifestyle</a></li>';
            }
        }
    }

    // Initialize navigation on page load
    renderNavigation();
    renderFooterNav();

    // ==========================================
    // Core Logic
    // ==========================================
    var maxArticleId = 0;
    var defaultFallback = 'https://images.unsplash.com/photo-1518770660439-4636190af475?w=600&h=400&fit=crop';
    var fallbackImages = {
        'technology': 'https://images.unsplash.com/photo-1518770660439-4636190af475?w=600&h=400&fit=crop',
        'finance': 'https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?w=600&h=400&fit=crop',
        'ai-tools': 'https://images.unsplash.com/photo-1677442136019-21780ecad995?w=600&h=400&fit=crop',
        'health-lifestyle': 'https://images.unsplash.com/photo-1498837167922-ddd27525d352?w=600&h=400&fit=crop'
    };
    function buildCategoryNames(config) {
        var names = {};
        if (config && config.categories) {
            for (var i = 0; i < config.categories.length; i++) {
                names[config.categories[i].id] = config.categories[i].name;
            }
        } else {
            names = { 'technology': 'Technology', 'finance': 'Finance', 'ai-tools': 'AI Tools', 'health-lifestyle': 'Health & Lifestyle' };
        }
        return names;
    }
    function getFallbackImage(category) {
        return fallbackImages[category] || defaultFallback;
    }
    function formatDate(dateStr) {
        if (dateStr) {
            var d = new Date(dateStr);
            return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
        }
        return '';
    }
    function generateDate(articleId, maxId) {
        var today = new Date();
        var date = new Date(today);
        date.setDate(date.getDate() - Math.floor((maxId - articleId) / 3));
        return date.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
    }
    function renderArticle(article, maxId) {
        var container = document.getElementById('articleDetail');
        var loading = document.getElementById('loading');
        if (loading) loading.remove();
        
        var date = article.date ? formatDate(article.date) : generateDate(article.id, maxId);
        var catName = categoryNames[article.category] || article.category;
        var fallbackImg = getFallbackImage(article.category);
        var heroImg = article.image.replace('w=600&h=400', 'w=1200&h=600');
        var articleContent = article.content
            ? article.content
            : '<p>' + article.excerpt + '</p><p><em>This article is being updated. Check back soon for the full content.</em></p>';
        
        container.innerHTML = 
            '<div class="article-hero">' +
            '<img src="' + heroImg + '" alt="' + article.title + '" loading="lazy" onerror="this.src=\'' + fallbackImg.replace('w=600&h=400', 'w=1200&h=600') + '\'">' +
            '</div>' +
            '<div class="article-body">' +
            '<header class="article-header">' +
            '<span class="card-category">' + catName + '</span>' +
            '<h1>' + article.title + '</h1>' +
            '<div class="article-meta">' +
            '<span>' + date + '</span>' +
            '</div>' +
            '</header>' +
            '<div class="article-content">' +
            articleContent +
            '</div>' +
            '</div>';
        
        var siteName = (siteConfig && siteConfig.siteName) ? siteConfig.siteName : 'HelloInsights';
        document.title = article.title + ' - ' + siteName;
    }
    function renderRelated(currentArticle, allArticles) {
        var related = allArticles.filter(function(a) { 
            return a.category === currentArticle.category && a.id !== currentArticle.id; 
        }).slice(0, 3);
        
        if (related.length === 0) {
            document.getElementById('relatedSection').style.display = 'none';
            return;
        }
        
        var grid = document.getElementById('relatedGrid');
        var html = '';
        
        for (var i = 0; i < related.length; i++) {
            var article = related[i];
            var articleFallback = getFallbackImage(article.category);
            var catName = categoryNames[article.category] || article.category;
            var date = article.date ? formatDate(article.date) : generateDate(article.id, maxArticleId);
            html += '<article class="article-card">' +
                '<div class="card-image">' +
                '<img src="' + article.image + '" alt="' + article.title + '" loading="lazy" onerror="this.src=\'' + articleFallback + '\'">' +
                '</div>' +
                '<div class="card-content">' +
                '<span class="card-category">' + catName + '</span>' +
                '<h3 class="card-title">' +
                '<a href="article.html?id=' + article.id + '">' + article.title + '</a>' +
                '</h3>' +
                '<p class="card-excerpt">' + article.excerpt + '</p>' +
                '<div class="card-meta">' +
                '<span> ' + date + '</span>' +
                '</div>' +
                '<a href="article.html?id=' + article.id + '" class="read-more-btn">Read More...</a>' +
                '</div>' +
                '</article>';
        }
        
        grid.innerHTML = html;
    }
    function toggleMenu() {
        var nav = document.getElementById('navContainer');
        if (nav) nav.classList.toggle('active');
    }
    function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }
    window.addEventListener('scroll', function() {
        var btn = document.getElementById('backToTop');
        if (btn) btn.classList.toggle('visible', window.pageYOffset > 300);
    });
    async function loadArticle() {
        // Step 1: Load config for category names
        await new Promise(function(resolve) {
            loadSiteConfig(function(config) {
                if (config) {
                    categoryNames = buildCategoryNames(config);
                } else {
                    categoryNames = { 'technology': 'Technology', 'finance': 'Finance', 'ai-tools': 'AI Tools', 'health-lifestyle': 'Health & Lifestyle' };
                }
                resolve();
            });
        });

        // Step 2: Get article ID from URL
        var urlParams = new URLSearchParams(window.location.search);
        var articleId = parseInt(urlParams.get('id')) || 1;

        // Step 3: Fetch articles - subdomain loads only its category, main domain loads all
        try {
            var allArticlesList = [];
            
            if (window.IS_SUBDOMAIN) {
                // Subdomain: only load the relevant category file
                var cat = window.SUBDOMAIN_CATEGORY;
                var data = await fetch('articles-' + cat + '.json', { cache: 'force-cache' })
                    .then(function(r) { return r.json(); });
                allArticlesList = data.articles || [];
                // Filter to ensure only this category (safety)
                allArticlesList = allArticlesList.filter(function(a) { return a.category === cat; });
            } else {
                // Main domain: load all categories
                var categories = ['technology', 'finance', 'ai-tools', 'health-lifestyle'];
                var promises = categories.map(function(cat) {
                    return fetch('articles-' + cat + '.json', { cache: 'force-cache' })
                        .then(function(r) { return r.json(); })
                        .then(function(data) { return data.articles || []; });
                });
                var results = await Promise.all(promises);
                for (var i = 0; i < results.length; i++) {
                    allArticlesList = allArticlesList.concat(results[i]);
                }
            }

            // Find target article by ID
            var article = allArticlesList.find(function(a) { return a.id === articleId; });
            if (!article) {
                throw new Error('Article not found');
            }

            // Calculate maxArticleId from list
            if (allArticlesList.length > 0) {
                maxArticleId = Math.max.apply(null, allArticlesList.map(function(a) { return a.id; }));
            }

            renderArticle(article, maxArticleId);

            // Step 4: Render related articles
            var related = allArticlesList.filter(function(a) {
                return a.category === article.category && a.id !== article.id;
            }).slice(0, 3);

            if (related.length === 0) {
                document.getElementById('relatedSection').style.display = 'none';
            } else {
                var grid = document.getElementById('relatedGrid');
                var html = '';
                for (var i = 0; i < related.length; i++) {
                    var ra = related[i];
                    var articleFallback = getFallbackImage(ra.category);
                    var catName = categoryNames[ra.category] || ra.category;
                    var date = ra.date ? formatDate(ra.date) : generateDate(ra.id, maxArticleId);
                    html += '<article class="article-card">' +
                        '<div class="card-image">' +
                        '<img src="' + ra.image + '" alt="' + ra.title + '" loading="lazy" onerror="this.src=\'' + articleFallback + '\'">' +
                        '</div>' +
                        '<div class="card-content">' +
                        '<span class="card-category">' + catName + '</span>' +
                        '<h3 class="card-title">' +
                        '<a href="article.html?id=' + ra.id + '">' + ra.title + '</a>' +
                        '</h3>' +
                        '<p class="card-excerpt">' + ra.excerpt + '</p>' +
                        '<div class="card-meta">' +
                        '<span>📅 ' + date + '</span>' +
                        '</div>' +
                        '<a href="article.html?id=' + ra.id + '" class="read-more-btn">Read More...</a>' +
                        '</div>' +
                        '</article>';
                }
                grid.innerHTML = html;
            }
        } catch (error) {
            console.error('Error:', error);
            var container = document.getElementById('articleDetail');
            if (container) {
                container.innerHTML = '<p style="text-align: center; padding: 3rem;">Unable to load article. <a href="index.html">Return to homepage</a></p>';
            }
        }
    }
    document.addEventListener('DOMContentLoaded', loadArticle);
    </script>
</body>
</html>
